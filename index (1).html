<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studieboard · Dataanalyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- SKRIFT-ERSTATNINGER: Framna Serif og Framna Sans er ikke tilgængelige her.
     Playfair Display står i stedet for Framna Serif (højkontrast, redaktionel).
     Figtree står i stedet for Framna Sans (neutral geometrisk-humanistisk).
     Har du licens til de rigtige, byttes de i --d og --b herunder. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══ FRAMNA-PALETTEN — kun disse otte farver findes ══ */
:root{
  --gn:#1BC866;   /* Green — ledende farve */
  --gns:#0EB355;  /* Green shade */
  --ap:#FFB55D;   /* Apricot */
  --aps:#FF9D29;  /* Apricot shade */
  --bl:#E4EFF1;   /* Blue — det rolige lærred */
  --bls:#CFE2E5;  /* Blue shade */
  --bk:#000000;
  --wh:#FFFFFF;
  /* aliaser, så de samme navne bruges konsekvent */
  --cv:var(--wh); --pl:var(--bl); --pl2:var(--bl); --pl3:var(--bls);
  --ink:var(--bk); --i2:var(--bk); --i3:var(--bk);
  --gnd:var(--gns); --gnl:var(--gn); --gnl2:var(--bl); --or:var(--ap); --orl:var(--ap);
  --d:'Playfair Display',Georgia,serif;   /* erstatning for Framna Serif */
  --b:'Figtree',system-ui,-apple-system,sans-serif;  /* erstatning for Framna Sans */
  --rl:28px; --rm:18px; --rs:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--wh);color:var(--bk);font:400 15px/1.5 var(--b);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2.5px solid var(--bk);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
mark{background:var(--ap);color:var(--bk);padding:1px 3px}
.num,.tm,.dt,.hero-time,.st b,.stp .sd{font-variant-numeric:tabular-nums}

/* ══ TOP ══ */
.app{min-height:100vh}
.rail{background:var(--wh);position:sticky;top:0;z-index:40}
.rail-in{max-width:1120px;margin:0 auto;padding:0 30px}
.logo{display:flex;align-items:center;gap:16px;padding:22px 0 8px}
.logo h1{font:700 23px/1.1 var(--d);letter-spacing:-.015em}
.logo p{font:400 14px var(--b)}
.logo .rt{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:14px 0 18px}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:9px 18px;border-radius:100px;color:var(--bk);text-decoration:none;font:400 15px var(--b);
  white-space:nowrap;flex:0 0 auto;transition:background .15s;display:flex;align-items:center;gap:9px;background:var(--bl)}
.nav a:hover{background:var(--bls)}
.nav a.on{background:var(--bk);color:var(--wh);font-weight:500}
.nav a .ic{display:none}
.nav a .bd{font:500 12px var(--b);padding:0 8px;border-radius:100px;background:var(--wh);color:var(--bk);min-width:21px;text-align:center}
.nav a.on .bd{background:var(--wh);color:var(--bk)}
.nav a .bd.hot{background:var(--ap);color:var(--bk)}
.drv a{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:100px;color:var(--bk);
  text-decoration:none;font:400 14px var(--b);background:var(--bl);transition:background .15s}
.drv a:hover{background:var(--gn)}
.drv a .ar{font-size:12px}
.sy{display:flex;align-items:center;gap:9px;font:400 13.5px var(--b);color:var(--bk);white-space:nowrap;
  background:var(--bl);padding:8px 15px;border-radius:100px}
.sy .led{width:9px;height:9px;border-radius:50%;background:var(--gn);flex:0 0 9px}
.sy .led.w{background:var(--ap)}.sy .led.b{background:var(--aps)}
#syn{display:none}

main{max-width:1120px;margin:0 auto}
.wrap{padding:14px 30px 130px}

.ph{margin-bottom:30px}
.ph h2{font:700 44px/1.1 var(--d);letter-spacing:-.022em}
.ph .sub{font:400 20px/1.4 var(--b);margin-top:12px}

.sec{margin-bottom:34px}
/* små pille-tags, sentence case, Sans Regular — som i brandets egne slides */
.sech{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sech h3{font:400 14px var(--b);background:var(--bl);padding:5px 14px;border-radius:100px}
.sech .sp{flex:1}
.sech .ct{font:400 14px var(--b)}
.card{background:var(--bl);border-radius:var(--rl);overflow:hidden;padding:10px}
.card.pad{padding:30px 34px}

/* ══ FORSIDE ══ */
.top{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;margin-bottom:14px}
/* grøn leder: det største farveområde på siden */
.big{background:var(--gn);border-radius:var(--rl);padding:36px 38px;position:relative;overflow:hidden}
.big::after{content:'eksamen';position:absolute;right:-4px;bottom:-40px;font:700 140px/1 var(--d);
  color:var(--gns);letter-spacing:-.05em;pointer-events:none;z-index:0}
.big>*{position:relative;z-index:1}
.big.grp::after{content:'gruppe'}
.big .lbl{font:400 15px var(--b);position:relative}
.big .num{font:700 96px/1.1 var(--d);letter-spacing:-.045em;margin:14px 0 10px;position:relative}
.big .capt{font:400 20px/1.4 var(--b);position:relative}
.big .bar{height:14px;background:var(--wh);margin-top:28px;border-radius:100px;overflow:hidden;position:relative}
.big .bar i{display:block;height:100%;background:var(--gns);border-radius:100px}
.big .prog{display:flex;justify-content:space-between;font:400 14px var(--b);margin-top:11px;position:relative}

.nxt{background:var(--bl);border-radius:var(--rl);padding:10px;display:flex;flex-direction:column}
.nxt>*{padding-left:28px;padding-right:28px}
.nxt .lbl{font:400 15px var(--b);padding-top:26px}
.nxt .tm{font:700 52px/1.1 var(--d);letter-spacing:-.035em;margin:14px 0 10px}
.nxt .em{font:700 26px/1.2 var(--d);margin-bottom:8px;letter-spacing:-.015em}
.nxt .mt{font:400 16px/1.4 var(--b)}
.nxt .go{margin-top:auto;padding-top:26px;padding-bottom:26px}

.wkstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ds{background:var(--wh);border-radius:var(--rm);padding:19px 20px;text-align:left;min-height:136px;
  box-sizing:border-box;border:1px solid var(--bl)}
.ds.free{background:var(--bl);border-color:var(--bl)}
.ds.now,.ds.now.free{background:var(--bk);color:var(--wh);border-color:var(--bk)}
.ds .dn{font:400 13px var(--b);display:flex;justify-content:space-between}
.ds .dt{font:700 30px/1 var(--d);margin:16px 0 6px;letter-spacing:-.03em}
.ds .dr{font:400 14px var(--b)}
.ds .de{font:400 14px/1.35 var(--b);margin-top:11px}
.ds .dz{font:400 15px var(--b);margin-top:16px}

/* nummererede markører ① ② ③ */
.f3{background:var(--wh);border-radius:var(--rm);padding:8px 28px}
.f3 .sl{display:flex;align-items:center;gap:22px;padding:17px 0}
.f3 .sl+.sl{border-top:1px solid var(--bl)}
.f3 .n{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--bl);color:var(--bk);
  display:grid;place-items:center;font:700 20px var(--d);transition:background .18s}
.f3 .sl.f .n{background:var(--ap)}
.f3 input{flex:1;background:none;border:0;padding:6px 0;font:400 18px var(--b)}
.f3 input:focus{outline:none}

/* ══ LISTER ══ */
.li{display:flex;gap:16px;align-items:flex-start;padding:18px 26px;background:var(--wh)}
.li:first-child{border-radius:var(--rm) var(--rm) 0 0}
.li:last-child{border-radius:0 0 var(--rm) var(--rm)}
.li:only-child{border-radius:var(--rm)}
.li+.li{border-top:1px solid var(--bl)}
.li:hover{background:var(--bl)}
.li.done{background:var(--bl)}
.chk{width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:var(--bl);
  display:grid;place-items:center;font-size:13px;line-height:1;margin-top:1px;color:var(--bk);transition:background .15s}
.chk:hover{background:var(--bls)}
.chk.on{background:var(--gn)}
.li .bd{flex:1;min-width:0}
.li .tt{font:400 16px/1.45 var(--b);word-break:break-word}
.li.done .tt{text-decoration:line-through;text-decoration-thickness:1.5px}
.li .mt{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px;align-items:center}
.tag{font:400 13px var(--b);padding:3px 13px;border-radius:100px;background:var(--bl);color:var(--bk);white-space:nowrap}
.tag.cr{background:var(--aps)}
.tag.yl{background:var(--ap)}
.tag.ac{background:var(--gn)}
.tag.sc{background:var(--bls)}
.tag.so{background:var(--bk);color:var(--wh)}
.x{color:var(--bk);padding:5px 10px;border-radius:100px;font-size:18px;line-height:1;flex:0 0 auto;visibility:hidden}
.li:hover .x,.frow .x,.li .x:focus-visible{visibility:visible}
.x:hover{background:var(--aps)}

/* ══ FELTER ══ */
.qa{display:flex;gap:10px;padding:24px 26px;background:var(--wh);flex-wrap:wrap;
  border-radius:var(--rm) var(--rm) 0 0;border-bottom:1px solid var(--bl)}
.qa input,.qa select{background:var(--bl);border:0;border-radius:100px;padding:12px 20px;min-width:0;font:400 15px var(--b)}
.qa input.g{flex:1 1 200px}.qa input.s{flex:0 0 150px}.qa select{flex:0 0 auto;padding-right:16px}
.qa input:focus,.qa select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--bk)}
.btn{background:var(--bk);color:var(--wh);border-radius:100px;padding:12px 26px;font:400 15px var(--b);flex:0 0 auto;transition:background .15s}
.btn:hover{background:var(--ap);color:var(--bk)}
.btn.gh{background:var(--wh);color:var(--bk);border:1.5px solid var(--bk)}
.btn.gh:hover{background:var(--ap)}
.btn.sm{padding:7px 16px;font-size:14px}

.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fil button{padding:8px 17px;border-radius:100px;font:400 15px var(--b);background:var(--bl)}
.fil button:hover{background:var(--bls)}
.fil button.on{background:var(--bk);color:var(--wh)}
.fil .n{font-size:13px;margin-left:7px}

/* venstrestillet — brandet centrerer aldrig brødtekst */
.emp{text-align:left;padding:40px 34px;background:var(--wh);border-radius:var(--rm)}
.emp .ei{display:none}
.emp b{display:block;font:700 28px/1.15 var(--d);margin-bottom:12px;letter-spacing:-.02em}
.emp p{font:400 17px/1.45 var(--b);max-width:52ch}

.fld{margin-bottom:26px}
.fld:last-child{margin-bottom:0}
.fld label{display:flex;align-items:center;gap:12px;font:400 14px var(--b);margin-bottom:10px}
.fld label .h{font:400 14px var(--b);margin-left:auto}
.fld input,.fld textarea{width:100%;background:var(--bl);border:0;border-radius:var(--rm);
  padding:17px 20px;font:400 16px/1.5 var(--b)}
.fld textarea{resize:vertical;min-height:170px}
.fld textarea.sm{min-height:100px}
.fld input:focus,.fld textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--bk);background:var(--wh)}
.fld input.emne{font:700 28px var(--d);padding:18px 20px;letter-spacing:-.02em}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ══ I DAG ══ */
.hero{background:var(--bl);border-radius:var(--rl);padding:10px}
.hero.no{background:var(--bl)}
.hero-t{display:flex;align-items:center;gap:14px;padding:24px 28px 0;flex-wrap:wrap}
.hero-t .w{font:400 15px var(--b)}
.hero-t .r{margin-left:auto;display:flex;gap:9px}
.hero-b{padding:16px 28px 28px}
.hero-time{font:700 62px/1.1 var(--d);letter-spacing:-.04em}
.hero-time small{font:400 16px var(--b);margin-left:18px;letter-spacing:0}
.hero-b>div:has(.fld){background:var(--wh);border-radius:var(--rm);padding:28px;margin-top:24px}

/* ══ SØG ══ */
.srch{position:relative;margin-bottom:22px}
.srch input{width:100%;background:var(--bl);border:0;border-radius:100px;padding:20px 26px 20px 60px;font:400 18px var(--b)}
.srch input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--bk);background:var(--wh)}
.srch .mg{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.srch .cl{position:absolute;right:13px;top:50%;transform:translateY(-50%);border-radius:100px;
  padding:9px 18px;font:400 14px var(--b);background:var(--wh)}
.srch .cl:hover{background:var(--bk);color:var(--wh)}

.emnes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.emnes button{border-radius:100px;padding:10px 19px;font:400 15px var(--b);
  display:flex;align-items:center;gap:10px;background:var(--bl)}
.emnes button:hover{background:var(--bls)}
.emnes button.on{background:var(--bk);color:var(--wh)}
.emnes button .c{font-size:13px}

/* ══ NOTEKORT ══ */
.nrow{display:block;width:100%;text-align:left;padding:26px;position:relative;background:var(--wh)}
.nrow:first-child{border-radius:var(--rm) var(--rm) 0 0}
.nrow:last-child{border-radius:0 0 var(--rm) var(--rm)}
.nrow:only-child{border-radius:var(--rm)}
.nrow+.nrow{border-top:1px solid var(--bl)}
.nrow:hover{background:var(--bl)}
.nrow .r1{display:flex;align-items:baseline;gap:18px;margin-bottom:9px}
.nrow .em{font:700 26px/1.2 var(--d);letter-spacing:-.022em;flex:1;min-width:0}
.nrow .em.q{font:400 20px var(--d);font-style:italic}
.nrow .dt{font:400 14px var(--b);flex:0 0 auto}
.nrow .sn{font:400 16px/1.5 var(--b);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .r3{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.nrow.today{background:var(--gn)}
.nrow.fut{background:var(--bl)}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--bls);display:inline-block}
.dots i.n{background:var(--gn)}.dots i.f{background:var(--bk)}.dots i.h{background:var(--ap)}

/* ══ PANEL ══
   Baggrunden bag panelet er den eneste gennemsigtighed i systemet.
   Den er funktionel, ikke dekorativ: uden den forsvinder laget bagved. */
.det{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;justify-content:flex-end}
.det-p{width:min(720px,100%);background:var(--wh);height:100%;overflow-y:auto}
.det-h{position:sticky;top:0;background:var(--wh);padding:28px 32px 20px;z-index:2}
.det-h .r1{display:flex;align-items:flex-start;gap:20px}
.det-h h4{font:700 36px/1.1 var(--d);letter-spacing:-.028em;flex:1;min-width:0}
.det-h .cl{border-radius:50%;width:42px;height:42px;font-size:20px;flex:0 0 42px;background:var(--bl)}
.det-h .cl:hover{background:var(--bk);color:var(--wh)}
.det-h .r2{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.det-b{padding:6px 32px 100px}
.det-b .fld{background:var(--bl);border-radius:var(--rl);padding:10px;margin-bottom:12px}
.det-b .fld label{padding:18px 22px 0;margin-bottom:9px}
.det-b .fld>input,.det-b .fld>textarea{background:var(--wh);border-radius:var(--rm)}
.det-b .fld>div{padding:0 10px 10px}
.det-b .fld .hint{padding:0 22px 16px;margin-top:0}
.flist{display:grid;gap:8px;padding:0 10px 10px}
.frow{display:flex;align-items:center;gap:13px;background:var(--wh);border-radius:100px;padding:13px 22px}
.frow .fn{flex:1;min-width:0;font:400 15px var(--b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow a{color:var(--bk);font:500 14px var(--b);flex:0 0 auto;text-decoration:underline}

/* ══ SEMESTERBÅND ══ */
.band{padding:30px 34px;background:var(--bl)}
.bandh{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.bandh h3{font:400 14px var(--b);background:var(--wh);padding:5px 14px;border-radius:100px}
.lgd{display:flex;gap:8px;flex-wrap:wrap}
.lgd span{display:flex;align-items:center;background:var(--wh);padding:6px 14px;border-radius:100px;font:400 13.5px var(--b)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px}
.strip{display:flex;gap:2.5px;align-items:flex-end;height:84px;background:var(--wh);
  border-radius:var(--rm) var(--rm) 0 0;padding:16px 16px 0}
.strip i{flex:1;min-width:2px;border-radius:3px 3px 0 0;background:var(--bl);height:14%}
.strip i.am{background:var(--gn);height:52%}
.strip i.pm{background:var(--gns);height:100%}
.strip i.so{background:var(--bls);height:30%}
.strip i.ex{background:var(--ap);height:100%}
.strip i.we{background:var(--wh);height:6%}
.strip i.nw{background:var(--bk)}
.mrow{display:flex;font:400 13px var(--b);background:var(--wh);border-radius:0 0 var(--rm) var(--rm);padding:10px 16px 16px}

.lrow{display:flex;align-items:center;gap:20px;padding:18px 26px;width:100%;text-align:left;background:var(--wh)}
.lrow:first-child{border-radius:var(--rm) var(--rm) 0 0}
.lrow:last-child{border-radius:0 0 var(--rm) var(--rm)}
.lrow+.lrow{border-top:1px solid var(--bl)}
.lrow:hover{background:var(--bl)}
.lrow.past{background:var(--bl)}
.lrow.today{background:var(--gn)}
.lrow .dt{font:400 14.5px var(--b);flex:0 0 108px}
.lrow .tw2{font:400 14.5px var(--b);flex:0 0 114px}
.lrow .nm{flex:1;min-width:0;font:400 16px var(--b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .rm{font:400 14px var(--b);flex:0 0 auto}
.lrow .cv{font-size:19px;flex:0 0 14px;text-align:right}

.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:12px;margin-bottom:30px}
.st>div{background:var(--bl);border-radius:var(--rm);padding:24px 26px}
.st b{display:block;font:700 40px/1 var(--d);letter-spacing:-.035em}
.st span{display:block;font:400 14px var(--b);margin-top:13px}

.exb{background:var(--bl);border-radius:var(--rl);padding:10px}
.stp{display:flex;align-items:center;gap:22px;padding:24px 26px;font:400 16px var(--b);background:var(--wh)}
.stp:first-child{border-radius:var(--rm) var(--rm) 0 0}
.stp:last-child{border-radius:0 0 var(--rm) var(--rm)}
.stp+.stp{border-top:1px solid var(--bl)}
.stp .sd{font:500 15px var(--b);flex:0 0 136px}
.stp .sk{flex:1}
.stp .sn{font:400 14px var(--b);flex:0 0 auto}
.stp.hot{background:var(--ap)}
.stp.hot .sd,.stp.hot .sk{font-weight:600}

.nt{border-radius:var(--rl);padding:30px 34px;margin-bottom:28px;font:400 16px/1.5 var(--b);background:var(--bl)}
.nt.w{background:var(--ap)}
.nt b{display:block;font:700 28px/1.2 var(--d);margin-bottom:14px;letter-spacing:-.02em}
.nt p{font:400 17px/1.45 var(--b);max-width:64ch}
.nt code{background:var(--ap);padding:2px 11px;border-radius:100px;font:500 15px var(--b)}
.nt.w code{background:var(--wh)}

.tw{overflow-x:auto;background:var(--wh);border-radius:var(--rm)}
table{width:100%;border-collapse:collapse;font:400 16px var(--b)}
th{text-align:left;font:400 14px var(--b);padding:22px 24px 14px;white-space:nowrap}
td{padding:17px 24px;border-top:1px solid var(--bl)}
td.m{font:400 14.5px var(--b);white-space:nowrap}
tbody tr:hover{background:var(--bl)}

/* ══ HURTIGNOTE ══ */
.fab{position:fixed;bottom:34px;right:34px;z-index:60;width:62px;height:62px;border-radius:50%;
  background:var(--bk);color:var(--wh);font-size:30px;display:grid;place-items:center;transition:background .15s}
.fab:hover{background:var(--gn);color:var(--bk)}
.cap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:grid;place-items:start center;padding:14vh 20px 0}
.cap-b{width:min(640px,100%);background:var(--bl);border-radius:var(--rl);padding:10px}
.cap-b input{width:100%;padding:28px 30px;font:400 20px var(--b);border:0;background:var(--wh);border-radius:var(--rm)}
.cap-b input:focus{outline:none}

}

<script>

/* ═══ SKEMA — TimeEdit ═══ */
const RAW=[['08-24','09:00','12:30','FIR.307'],['08-25','12:30','16:00','FIR.310'],['08-26','09:00','12:30','FIR.310'],
['08-27','09:00','12:30','FIR.310'],['08-28','09:00','12:30','FIR.310'],['08-31','09:00','12:30','FIR.307'],
['09-01','12:30','15:55','FIR.307'],['09-03','12:30','16:00','FIR.307'],['09-04','09:00','12:30','FIR.307'],
['09-07','09:00','12:30','FIR.307'],['09-08','12:30','16:00','FIR.307'],['09-10','12:30','16:00','FIR.304'],
['09-11','09:00','12:25','FIR.307'],['09-14','09:00','12:30','FIR.307'],['09-15','12:30','16:00','FIR.307'],

['10-20','12:30','16:00','FIR.307'],['10-22','12:30','16:00','FIR.304'],['10-23','09:00','12:30','FIR.307'],
['10-26','09:00','12:30','FIR.307'],['10-27','12:30','16:00','FIR.307'],['10-29','09:00','12:30','Online'],

['11-16','09:00','12:30','FIR.401+402'],['11-17','12:30','16:00','FIR.307'],['11-20','09:00','12:30','FIR.307'],
['11-23','09:00','12:30','FIR.307'],['11-24','12:30','16:00','FIR.307'],['11-27','09:00','12:30','FIR.307']];
let LESSONS=RAW.map((r,i)=>({id:'L'+String(i+1).padStart(2,'0'),date:'2026-'+r[0],start:r[1],end:r[2],
  room:r[3],kind:'lesson',title:'Undervisning',teach:'Baum / Wulf',no:i+1}));
let SOCIAL=[['08-27','14:00','18:00','Introcafé'],['10-01','14:00','18:00','BarFirs'],
 ['10-29','14:00','19:00','BarFirs'],['11-19','14:00','19:00','BarFirs']]
 .map((s,i)=>({id:'S'+i,date:'2026-'+s[0],start:s[1],end:s[2],room:'FIR.Kantinen',kind:'social',title:s[3],teach:'Frivilligt'}));
const EXAM={n:'1. semesterprøve',f:'Skriftlig aflevering med mundtlig eksamen · 30 minutter',
  s:[['2026-12-07','12:00','Aflevering af skriftlig opgave',1],
     ['2026-12-14','','Udlevering af eksamensopgave',0],
     ['2026-12-15','','Mundtlig prøve · 15.–16. december',0]]};
const DL='2026-12-07',START='2026-08-24',LAST='2026-11-27';
const DRIVE_DEF='https://drive.google.com/drive/folders/16C6MqBW8WPv1fzcYq-l8dEWkY80Hi9_v';
const GDRIVE_DEF='https://drive.google.com/drive/folders/1mQMS803OrUGcnCdsnnHppv_6c7xCYcT0';
const DN=['søn','man','tir','ons','tor','fre','lør'],DF=['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const MO=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

/* ═══ HELPERS ═══ */
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const T=new Date();T.setHours(0,0,0,0);const TS=iso(T);
const dd=s=>Math.round((P(s)-T)/864e5);
const fD=s=>{const d=P(s);return`${d.getDate()}. ${MO[d.getMonth()]}`};
const fL=s=>{const d=P(s);return`${DN[d.getDay()]} ${d.getDate()}. ${MO[d.getMonth()]}`};
const fF=s=>{const d=P(s);return`${DF[d.getDay()]} ${d.getDate()}. ${MO[d.getMonth()]}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mon=(o=0)=>{const d=new Date(T);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const rel=n=>n===0?'i dag':n===1?'i morgen':n===-1?'i går':n<0?Math.abs(n)+' dage siden':'om '+n+' dage';


const K='studieboard:v3';
let S={lessons:{},tasks:[],reading:[],files:[],inbox:[],pins:[],rep:[],drive:'',gdrive:'',
  grp:{meets:[],tasks:[],members:[]},focus:['','',''],meta:{}};
let MODE='none',DIRTY=0;
const drive=()=>(S.drive||DRIVE_DEF).trim();
const gdrive=()=>(S.gdrive||GDRIVE_DEF).trim();
const G=()=>{S.grp=S.grp||{};S.grp.meets=S.grp.meets||[];S.grp.tasks=S.grp.tasks||[];S.grp.members=S.grp.members||[];return S.grp};
const DEV=(()=>{try{return navigator.userAgent.includes('Mac')?'Mac':'PC'}catch(e){return'?'}})();

/* ═══ GITHUB-SYNK — tokenet gemmes KUN lokalt i browseren, aldrig i repoet ═══ */
const GK='studieboard:github';
let GHSHA=null,GHERR='';
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem(GK)||'null')}catch(e){return null}};
const ghSave=c=>{c?localStorage.setItem(GK,JSON.stringify(c)):localStorage.removeItem(GK)};
function b64(str){const b=new TextEncoder().encode(str);let o='';
  for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function unb64(t){const bin=atob(t.replace(/\s/g,''));const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
const ghUrl=c=>'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'data.json');
const ghHead=c=>({Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghPull(){
  const c=ghCfg();if(!c)return null;
  const r=await fetch(ghUrl(c)+'?ref='+(c.branch||'main')+'&t='+Date.now(),{headers:ghHead(c),cache:'no-store'});
  if(r.status===404){GHSHA=null;return{sha:null,text:null}}
  if(r.status===401||r.status===403)throw new Error('Tokenet blev afvist eller er udløbet');
  if(!r.ok)throw new Error('GitHub svarede '+r.status);
  const j=await r.json();GHSHA=j.sha;return{sha:j.sha,text:unb64(j.content||'')};
}
async function ghPush(text){
  const c=ghCfg();if(!c)throw new Error('ikke forbundet');
  const mk=sha=>{const b={message:'Studieboard '+new Date().toLocaleString('da-DK'),content:b64(text),branch:c.branch||'main'};
    if(sha)b.sha=sha;return b};
  let r=await fetch(ghUrl(c),{method:'PUT',headers:{...ghHead(c),'Content-Type':'application/json'},body:JSON.stringify(mk(GHSHA))});
  if(r.status===409||r.status===422){
    const rem=await ghPull();
    let remAt=0;try{remAt=(JSON.parse(rem.text||'{}').meta||{}).at||0}catch(e){}
    if(remAt>((S.meta&&S.meta.at)||0)){
      localStorage.setItem(K+':konflikt',text);
      S={...S,...JSON.parse(rem.text)};DIRTY=0;draw();
      throw new Error('Den anden computer var nyere. Hentet ind — dine sidste ændringer ligger som kopi');
    }
    r=await fetch(ghUrl(c),{method:'PUT',headers:{...ghHead(c),'Content-Type':'application/json'},body:JSON.stringify(mk(rem.sha))});
  }
  if(!r.ok)throw new Error('Kunne ikke gemme ('+r.status+')');
  GHSHA=(await r.json()).content.sha;
}

const Disk={
  async get(){
    if(ghCfg()){MODE='github';GHERR='';
      try{const r=await ghPull();if(r&&r.text)return r.text}
      catch(e){GHERR=e.message;MODE='gherr'}
      try{return localStorage.getItem(K)}catch(e){return null}}
    if(window.storage){try{const r=await window.storage.get(K);MODE='cloud';return r&&r.value?r.value:null}catch(e){MODE='cloud';return null}}
    try{const v=localStorage.getItem(K);MODE='local';return v}catch(e){MODE='none';return null}},
  async set(v){
    if(ghCfg()){try{localStorage.setItem(K,v)}catch(e){}
      await ghPush(v);MODE='github';GHERR='';return}
    if(window.storage)return window.storage.set(K,v);
    if(MODE==='local')return localStorage.setItem(K,v);throw new Error('x')}};
async function load(){const r=await Disk.get();
  if(r){try{const p=JSON.parse(r);S={...S,...p};if(!Array.isArray(S.focus)||S.focus.length!==3)S.focus=['','',''];S.meta=S.meta||{}}catch(e){}}}
let sv;
function save(now){DIRTY=1;clearTimeout(sv);
  const go=async()=>{S.meta={...S.meta,at:Date.now(),dev:DEV};
    try{await Disk.set(JSON.stringify(S));DIRTY=0;
      toast('Gemt '+new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}))}
    catch(e){toast('Kunne ikke gemme',1)}syncBadge()};
  now?go():sv=setTimeout(go,600)}
function set(fn,now){fn();save(now);draw()}
function driveBadge(){const d=$('#drv');if(!d)return;
  const u=drive();
  d.innerHTML=u?`<a href="${E(u)}" target="_blank" rel="noopener" title="Åbner din Drive-mappe i en ny fane">
    <span>Materialemappe</span><span class="ar">↗</span></a>`:'';}
function syncBadge(){const a=$('#sy'),b=$('#syn');if(!a)return;
  const m={github:['','Synk til GitHub','Samme data på alle dine computere.'],
    gherr:['b','Synk fejlede',''+GHERR],
    cloud:['','Gemmer på din konto','Følger dig mellem begge computere.'],
    local:['w','Kun denne '+DEV,'Lav backup under Arkiv for at flytte data.'],
    none:['b','Gemmer ikke','Åbn boardet i Claude.']}[MODE]||['b','—',''];
  a.innerHTML=`<span class="led ${m[0]}"></span><span>${m[1]}</span>`;
  b.textContent=(S.meta&&S.meta.at?`Sidst gemt ${new Date(S.meta.at).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. `:'')+m[2]}
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||DIRTY)return;
  if(ghCfg()){try{const r=await ghPull();if(!r||!r.text)return;const p=JSON.parse(r.text);
    if(p.meta&&p.meta.at&&(!S.meta.at||p.meta.at>S.meta.at)){S={...S,...p};draw();toast('Hentet nyeste version')}}
    catch(e){GHERR=e.message;MODE='gherr';syncBadge()}return}
  if(!window.storage)return;
  const r=await Disk.get();if(!r)return;
  try{const p=JSON.parse(r);if(p.meta&&p.meta.at&&(!S.meta.at||p.meta.at>S.meta.at)){S={...S,...p};draw();toast('Hentet nyeste version')}}catch(e){}});

/* ═══ AFLEDT ═══ */
const on=ds=>[...LESSONS,...SOCIAL].filter(e=>e.date===ds);
const L=id=>S.lessons[id]||{};
const hasN=l=>{const x=L(l.id);return!!((x.note&&x.note.trim())||(x.key&&x.key.trim()))};
const hasF=l=>S.files.some(f=>f.lesson===l.id);
const hasH=l=>{const x=L(l.id);return!!(x.hw&&x.hw.trim()&&!x.hwDone)};
const emneOf=l=>(L(l.id).emne||'').trim();
function nextL(){const t=LESSONS.find(l=>l.date===TS);if(t)return{l:t,now:1};
  const n=LESSONS.find(l=>l.date>TS);return n?{l:n,now:0}:null}
const openT=()=>S.tasks.filter(t=>!t.done);
function examT(){return EXAM.s.filter(s=>s[3]).map(s=>({id:'X'+s[0],title:'Eksamen – aflevering',type:'Aflevering',due:s[0],fixed:1,done:0}))}
const gOpen=()=>G().tasks.filter(t=>!t.done);
const meetsOn=ds=>G().meets.filter(m=>m.date===ds);
const nextMeet=()=>G().meets.filter(m=>m.date>=TS).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''))[0];
const livePins=()=>(S.pins||[]).filter(p=>!p.until||p.until>=TS);
const allDue=()=>[...openT().filter(t=>t.due),
  ...gOpen().filter(t=>t.due).map(t=>({id:t.id,title:t.text,type:'Studiegruppe',due:t.due,grp:1})),
  ...examT()].sort((a,b)=>a.due.localeCompare(b.due));
function emneList(){const m={};LESSONS.forEach(l=>{const e=emneOf(l);if(e)m[e]=(m[e]||0)+1});
  return Object.entries(m).map(([e,n])=>({e,n})).sort((a,b)=>b.n-a.n||a.e.localeCompare(b.e))}
function searchAll(q){
  if(!q||q.length<2)return null;const t=q.toLowerCase();
  return LESSONS.map(l=>{const x=L(l.id);
    const fields=[['emne',x.emne],['noter',x.note],['huske',x.key],['lektier',x.hw],['spørgsmål',x.q],
      ['materiale',S.files.filter(f=>f.lesson===l.id).map(f=>f.name).join(' ')]];
    const hits=fields.filter(f=>f[1]&&String(f[1]).toLowerCase().includes(t));
    if(!hits.length)return null;
    const src=hits[0][1],i=String(src).toLowerCase().indexOf(t);
    return{l,hits:hits.map(h=>h[0]),snip:String(src).slice(Math.max(0,i-55),i+120),where:hits[0][0]};
  }).filter(Boolean)}
const hl=(s,q)=>{if(!q)return E(s);
  const i=s.toLowerCase().indexOf(q.toLowerCase());if(i<0)return E(s);
  return E(s.slice(0,i))+'<mark>'+E(s.slice(i,i+q.length))+'</mark>'+E(s.slice(i+q.length))};

/* ═══ NAV ═══ */
let tab='forside',wko=0,openL=null,tf='alle',nf='alle',q='';
const TABS=[['forside','Forside','◈'],['idag','I dag','◉'],['noter','Noter','✎'],
  ['opgaver','Opgaver','✓'],['studiegruppe','Studiegruppe','◎'],['skema','Skema','▤'],['pensum','Pensum','▧'],
  ['eksamen','Eksamen','◆'],['arkiv','Arkiv','⬒']];
function nav(){
  const od=allDue().filter(t=>dd(t.due)<=7&&dd(t.due)>=0).length;
  $('#nav').innerHTML=TABS.map(t=>{let b='';
    if(t[0]==='opgaver'){const n=openT().length;if(od)b=`<span class="bd hot">${od}</span>`;else if(n)b=`<span class="bd">${n}</span>`}
    if(t[0]==='idag'&&S.inbox.length)b=`<span class="bd">${S.inbox.length}</span>`;
    if(t[0]==='studiegruppe'&&gOpen().length)b=`<span class="bd">${gOpen().length}</span>`;
    return`<a href="#" data-t="${t[0]}" class="${tab===t[0]?'on':''}"><span class="ic">${t[2]}</span>${t[1]}${b}</a>`}).join('')}

/* ═══ BÅND ═══ */
function band(){
  let c='',lab=[],lm=-1,cur=P(START),end=P('2026-12-16');
  while(cur<=end){const ds=iso(cur),w=cur.getDay(),ev=on(ds),ls=ev.find(e=>e.kind==='lesson');
    let k='',tip=fL(ds);
    if(ls){k=ls.start==='09:00'?'am':'pm';tip+=` · ${ls.start}–${ls.end} · ${ls.room}`;const e=emneOf(ls);if(e)tip+=' · '+e}
    else if(ev.length){k='so';tip+=' · '+ev[0].title}
    else if(w===0||w===6){k='we';tip+=' · weekend'}else tip+=' · fri';
    if(ds===DL){k='ex';tip=fL(ds)+' · AFLEVERING 12:00'}
    if(ds==='2026-12-15'||ds==='2026-12-16'){k='ex';tip=fL(ds)+' · mundtlig'}
    if(ds===TS)k+=' nw';
    c+=`<i class="${k}" title="${E(tip)}"></i>`;
    if(cur.getMonth()!==lm){lab.push(MO[cur.getMonth()]);lm=cur.getMonth()}
    cur.setDate(cur.getDate()+1)}
  return`<div class="card band"><div class="bandh"><h3>Hele semestret</h3><div class="lgd">
    <span><i style="background:var(--gn)"></i>undervisning</span><span><i style="background:var(--pl3)"></i>socialt</span>
    <span><i style="background:var(--or)"></i>eksamen</span></div></div>
    <div class="strip">${c}</div><div class="mrow">${lab.map(m=>`<span style="flex:1">${m}</span>`).join('')}</div></div>`}

/* ═══ 1 · FORSIDE ═══ */
function vForside(){
  const n=dd(DL),nx=nextL();
  const total=Math.round((P(DL)-P(START))/864e5);
  const gone=Math.max(0,Math.min(total,Math.round((T-P(START))/864e5)));
  const held=LESSONS.filter(l=>l.date<TS).length;
  const m=mon(0),cells=[];
  for(let i=0;i<5;i++){const d=new Date(m);d.setDate(d.getDate()+i);const ds=iso(d);
    const ev=on(ds),ls=ev.find(e=>e.kind==='lesson'),so=ev.find(e=>e.kind==='social');
    const dq=allDue().filter(t=>t.due===ds),mq=meetsOn(ds);
    const pills=[...mq.map(m=>`<span class="tag">${m.time?E(m.time)+' ':''}studiegruppe</span>`),
                 ...dq.map(x=>`<span class="tag cr">${E(x.title)}</span>`)].join('');
    cells.push(`<div class="ds ${ds===TS?'now':''} ${!ls&&!so&&!dq.length&&!mq.length?'free':''}">
      <div class="dn"><span>${DN[d.getDay()]}</span><span>${d.getDate()}/${d.getMonth()+1}</span></div>

    ${S.inbox.length?`<div class="card">${S.inbox.slice().reverse().map(i=>`<div class="li">

/* ═══ 3 · NOTER ═══ */
function vNoter(){
  const res=searchAll(q),em=emneList();
  const written=LESSONS.filter(hasN);
  let list;
  if(res)list=res.map(r=>r.l);
  else if(nf==='alle')list=written;
  else if(nf==='tomme')list=LESSONS.filter(l=>l.date<TS&&!hasN(l));
  else if(nf==='materiale')list=LESSONS.filter(hasF);
  else list=LESSONS.filter(l=>emneOf(l)===nf);
  list=list.slice().sort((a,b)=>b.date.localeCompare(a.date));

  const row=l=>{const x=L(l.id),r=res&&res.find(z=>z.l.id===l.id);
    const e=emneOf(l);
    return`<button class="nrow ${l.date===TS?'today':''} ${l.date>TS?'fut':''}" data-open="${l.id}">
      <div class="r1"><span class="em ${e?'':'q'}">${e?hl(e,q):'Lektion '+l.no+' · uden emne'}</span>
        <span class="dt">${fL(l.date)}</span></div>
      ${r?`<div class="sn">…${hl(r.snip,q)}…</div>`:
        x.key&&x.key.trim()?`<div class="sn">${E(x.key)}</div>`:
        x.note&&x.note.trim()?`<div class="sn">${E(x.note.slice(0,170))}</div>`:''}
      <div class="r3"><span class="dots"><i class="${hasN(l)?'n':''}"></i><i class="${hasF(l)?'f':''}"></i><i class="${hasH(l)?'h':''}"></i></span>
        ${r?r.hits.map(h=>`<span class="tag yl">fundet i ${h}</span>`).join(''):''}
        ${hasH(l)?'<span class="tag yl">lektier mangler</span>':''}
        ${hasF(l)?`<span class="tag sc">${S.files.filter(f=>f.lesson===l.id).length} materiale</span>`:''}
      </div></button>`};

  return`<div class="srch"><span class="mg">⌕</span>
    <input id="q" value="${E(q)}" placeholder="Søg i alle noter, emner, lektier og materiale" autocomplete="off">
    ${q?'<button class="cl" data-a="clrq">ryd</button>':''}</div>
  ${res?`<div class="nt i"><b>${res.length} ${res.length===1?'lektion':'lektioner'} matcher "${E(q)}"</b>
    <p>Søger på tværs af emne, noter, det vigtigste, lektier, spørgsmål og navne på materiale.</p></div>`:
   `${em.length?`<div class="emnes">
      <button data-nf="alle" class="${nf==='alle'?'on':''}">Alle noter<span class="c">${written.length}</span></button>
      ${em.map(x=>`<button data-nf="${E(x.e)}" class="${nf===x.e?'on':''}">${E(x.e)}<span class="c">${x.n}</span></button>`).join('')}
      <button data-nf="materiale" class="${nf==='materiale'?'on':''}">Med materiale<span class="c">${LESSONS.filter(hasF).length}</span></button>
      <button data-nf="tomme" class="${nf==='tomme'?'on':''}">Timer uden noter<span class="c">${LESSONS.filter(l=>l.date<TS&&!hasN(l)).length}</span></button>
    </div>`:''}`}
  <div class="card">${list.length?list.map(row).join(''):
    `<div class="emp"><div class="ei">✎</div><b>${q?'Ingen noter matcher':nf==='alle'?'Ingen noter endnu':'Ingenting her'}</b>
      <p>${q?'Prøv et andet ord — søgningen kigger i al din tekst.':
        'Skriv noter under I dag. Giv hver time et emne, fx "Programmering" — så kan du finde dem igen ved at søge eller klikke på emnet.'}</p></div>`}
  </div>
  ${!res&&em.length?'<p class="hint">Grøn prik = noter · blå = materiale · gul = lektier ikke lavet</p>':''}`;
}

/* ═══ 4 · OPGAVER ═══ */
function vOpgaver(){
  const all=[...S.tasks,...examT()];
  const c={alle:all.filter(t=>!t.done).length,
    uge:all.filter(t=>!t.done&&t.due&&dd(t.due)>=0&&dd(t.due)<=7).length,
    over:all.filter(t=>!t.done&&t.due&&dd(t.due)<0).length,
    ingen:S.tasks.filter(t=>!t.done&&!t.due).length,
    done:S.tasks.filter(t=>t.done).length};
  let list=all.slice();
  if(tf==='alle')list=list.filter(t=>!t.done);
  if(tf==='uge')list=list.filter(t=>!t.done&&t.due&&dd(t.due)>=0&&dd(t.due)<=7);
  if(tf==='over')list=list.filter(t=>!t.done&&t.due&&dd(t.due)<0);
  if(tf==='ingen')list=list.filter(t=>!t.done&&!t.due);
  if(tf==='done')list=list.filter(t=>t.done);
  list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const F=[['alle','Åbne'],['uge','Denne uge'],['over','Overskredet'],['ingen','Uden dato'],['done','Færdige']];
  return`<div class="card" style="margin-bottom:18px"><div class="qa">
      <input class="g" id="t-t" placeholder="Hvad skal laves?">
      <select id="t-k"><option>Opgave</option><option>Aflevering</option><option>Læsning</option><option>Gruppearbejde</option></select>
      <input class="s" id="t-d" type="date"><button class="btn" data-a="task">Tilføj</button></div>
    <div style="padding:11px 18px;font-size:11.5px;color:var(--i3)">Afleveringsfrister fra Moodle skal ind her. Eksamen ligger der allerede.</div></div>
  <div class="fil">${F.map(f=>`<button data-tf="${f[0]}" class="${tf===f[0]?'on':''}">${f[1]}<span class="n">${c[f[0]]||0}</span></button>`).join('')}</div>
  <div class="card">${list.length?list.map(t=>{const n=t.due?dd(t.due):null;
    return`<div class="li ${t.done?'done':''}">
      ${t.fixed?'<span class="tag cr" style="margin-top:1px">fast</span>':`<button class="chk ${t.done?'on':''}" data-tog="${t.id}">${t.done?'✓':''}</button>`}
      <div class="bd"><div class="tt">${E(t.title)}</div><div class="mt">
      ${t.type?`<span class="tag ${t.type==='Aflevering'?'cr':t.type==='Læsning'?'sc':''}">${E(t.type)}</span>`:''}
      ${t.due?`<span class="tag ${n<0?'cr':n<=3?'yl':''}">${fD(t.due)} · ${rel(n)}</span>`:'<span class="tag">ingen dato</span>'}</div></div>
      ${t.fixed?'':`<button class="x" data-del="task:${t.id}">×</button>`}</div>`}).join(''):
    `<div class="emp"><div class="ei">✓</div><b>Ingenting her</b><p>${tf==='alle'?'Alt er lukket.':'Skift filter.'}</p></div>`}</div>`;
}

/* ═══ ICS ═══ */
function parseICS(txt){
  const u=txt.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');const L2=[],S2=[];let i=0;
  u.split('BEGIN:VEVENT').slice(1).forEach(b=>{
    const g=r=>{const m=b.match(r);return m?m[1].trim():''};
    const a=g(/DTSTART:(\d{8}T\d{6}Z)/);if(!a)return;
    const e=g(/DTEND:(\d{8}T\d{6}Z)/);
    const sum=g(/SUMMARY:([^\n]*)/).replace(/\\,/g,',').replace(/\\n/g,' ');
    if(/^Note:/.test(sum))return;
    const loc=g(/LOCATION:([^\n]*)/).replace(/Lokale:\s*/,'').replace(/\\,/g,' + ');
    const cv=z=>{const d=new Date(Date.UTC(+z.slice(0,4),+z.slice(4,6)-1,+z.slice(6,8),+z.slice(9,11),+z.slice(11,13)));
      return{d:iso(d),t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}};
    const A=cv(a),B=e?cv(e):A;
    const soc=/Reservationsårsag/.test(sum);
    if(soc){const r=(sum.match(/Reservationsårsag:\s*([^,(]+)/)||[])[1];
      S2.push({id:'S'+S2.length,date:A.d,start:A.t,end:B.t,room:loc||'—',kind:'social',title:(r||'Arrangement').trim(),teach:'Frivilligt'})}
    else{i++;const und=[...sum.matchAll(/Underviser:\s*([^.]+)\./g)].map(m=>m[1].trim().split(' ').pop()).join(' / ');
      L2.push({id:'L'+String(i).padStart(2,'0'),date:A.d,start:A.t,end:B.t,room:loc||'—',kind:'lesson',
        title:'Undervisning',teach:und||'—',no:i})}});
  return{L:L2,S:S2}}

let tt;
function toast(m,bad){const e=$('#toast');e.textContent=m;e.className='toast on'+(bad?' bad':'');
  clearTimeout(tt);tt=setTimeout(()=>e.className='toast',1900)}
const v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function capture(){if($('#cap'))return;
  document.body.insertAdjacentHTML('beforeend',`<div class="cap" id="cap"><div class="cap-b">

  setTimeout(()=>{const i=$('#cap-i');if(i)i.focus()},30)}
const capX=()=>{const c=$('#cap');if(c)c.remove()};

document.addEventListener('click',ev=>{
  if($('#cap')&&!ev.target.closest('.cap-b')){capX();return}
  if($('#det')&&ev.target.id==='det'){openL=null;draw();return}
  const b=ev.target.closest('button,a');if(!b)return;const D=b.dataset;
  if(D.t){ev.preventDefault();tab=D.t;wko=0;openL=null;q='';draw();window.scrollTo(0,0);return}
  if(D.close){openL=null;draw();return}
  if(D.open){openL=D.open;draw();return}
  if(D.tf){tf=D.tf;draw();return}
  if(D.nf){nf=D.nf;q='';draw();return}
  if(D.tog){set(()=>{const t=S.tasks.find(x=>x.id===D.tog);if(t)t.done=!t.done});return}
  if(D.togr){set(()=>{const r=S.reading.find(x=>x.id===D.togr);if(r)r.done=!r.done});return}
  if(D.togp){set(()=>{const r=S.rep.find(x=>x.id===D.togp);if(r)r.done=!r.done});return}
  if(D.togg){set(()=>{const t=G().tasks.find(x=>x.id===D.togg);if(t)t.done=!t.done});return}
  if(D.hwd){set(()=>{S.lessons[D.hwd]=S.lessons[D.hwd]||{};S.lessons[D.hwd].hwDone=!S.lessons[D.hwd].hwDone});return}
  if(D.mv){set(()=>{const i=S.inbox.find(x=>x.id===D.mv);
    S.tasks.push({id:uid(),title:i.t,type:'Opgave',due:'',done:false});S.inbox=S.inbox.filter(x=>x.id!==D.mv)});
    toast('Flyttet til Opgaver');return}
  if(D.del){const[k,id]=D.del.split(':');
    if(k==='gm'||k==='gt'||k==='gp'){const F={gm:'meets',gt:'tasks',gp:'members'}[k];
      set(()=>{G()[F]=G()[F].filter(x=>x.id!==id)});return}
    const M={task:'tasks',read:'reading',file:'files',inbox:'inbox',rep:'rep',pin:'pins'};
    set(()=>{S[M[k]]=(S[M[k]]||[]).filter(x=>x.id!==id)});return}
  const a=D.a;if(!a)return;
  if(a==='clrq'){q='';draw();setTimeout(()=>{const e=$('#q');if(e)e.focus()},20)}
  if(a==='task'){const x=v('t-t');if(!x)return toast('Skriv en opgave',1);
    set(()=>S.tasks.push({id:uid(),title:x,type:v('t-k')||'Opgave',due:v('t-d'),done:false}),1)}
  if(a==='read'){const x=v('r-t');if(!x)return toast('Skriv en titel',1);
    set(()=>S.reading.push({id:uid(),title:x,pages:v('r-p'),src:v('r-s'),due:v('r-d'),done:false}),1)}
  if(a==='rep'){const x=v('p-t');if(!x)return;set(()=>{S.rep=S.rep||[];S.rep.push({id:uid(),title:x,done:false})},1)}
  if(a==='file'){const x=v('f-n');if(!x)return toast('Giv den et navn',1);
    set(()=>S.files.push({id:uid(),name:x,url:v('f-u'),lesson:v('f-l')}),1)}
  if(a==='qfile'){const u=v('qf-u');if(!u)return toast('Sæt et link ind',1);
    const l=LESSONS.find(x=>x.id===D.l),e=emneOf(l);
    set(()=>S.files.push({id:uid(),name:(e||'Lektion '+l.no)+' – materiale',url:u,lesson:D.l}),1);toast('Link gemt')}
  if(a==='pfile'){const u=v('pf-u');if(!u)return toast('Sæt et link ind',1);
    set(()=>S.files.push({id:uid(),name:v('pf-n')||'Materiale',url:u,lesson:D.l}),1)}
  if(a==='capS'){const x=v('cap-i');if(!x)return capX();set(()=>S.inbox.push({id:uid(),t:x,at:TS}),1);capX();toast('Gemt')}
  if(a==='capT'){const x=v('cap-i');if(!x)return capX();
    set(()=>S.tasks.push({id:uid(),title:x,type:'Opgave',due:'',done:false}),1);capX();toast('Gemt som opgave')}
  if(a==='export'){const bl=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const u=URL.createObjectURL(bl),el=document.createElement('a');
    el.href=u;el.download='studieboard-backup-'+TS+'.json';el.click();URL.revokeObjectURL(u);toast('Backup hentet')}
  if(a==='ghOn'){const o=v('gh-o'),r=v('gh-r'),t=v('gh-t');
    if(!o||!r||!t)return toast('Udfyld alle tre felter',1);
    ghSave({owner:o,repo:r,token:t,path:'data.json',branch:'main'});
    toast('Forbinder…');
    (async()=>{try{const g=await ghPull();
      if(g&&g.text){const p=JSON.parse(g.text);
        if(confirm('Der ligger allerede data i repoet. Hent dem ind? (Annullér for at beholde det du har lokalt og lægge det op i stedet.)')){
          S={...S,...p};MODE='github';GHERR='';draw();return toast('Hentet fra GitHub')}}
      await ghPush(JSON.stringify(S));MODE='github';GHERR='';draw();toast('Forbundet og gemt')}
     catch(e){GHERR=e.message;MODE='gherr';draw();toast(e.message,1)}})()}
  if(a==='ghPull'){toast('Henter…');(async()=>{try{const g=await ghPull();
      if(!g||!g.text)return toast('Der ligger ingen data endnu',1);
      S={...S,...JSON.parse(g.text)};DIRTY=0;MODE='github';GHERR='';draw();toast('Hentet nyeste')}
     catch(e){GHERR=e.message;MODE='gherr';draw();toast(e.message,1)}})()}
  if(a==='ghPush'){save(1)}
  if(a==='ghOff'){if(!confirm('Afbryd synk på denne computer? Dine data bliver i repoet, og boardet gemmer herefter kun lokalt.'))return;
    ghSave(null);MODE='local';draw();toast('Synk afbrudt')}
  if(a==='ghConf'){const t=localStorage.getItem(K+':konflikt');if(!t)return;
    if(!confirm('Erstat det du har nu med den gemte kopi?'))return;
    try{S={...S,...JSON.parse(t)};localStorage.removeItem(K+':konflikt');save(1);toast('Kopi hentet ind')}catch(e){toast('Kopien kunne ikke læses',1)}}
  if(a==='pin'){const x=v('pn-t');if(!x)return toast('Skriv hvad du skal huske',1);
    set(()=>{S.pins=S.pins||[];S.pins.push({id:uid(),t:x,until:v('pn-u')})},1);toast('Fastgjort')}
  if(a==='gmeet'){const d=v('gm-d');if(!d)return toast('Vælg en dato',1);
    set(()=>G().meets.push({id:uid(),date:d,time:v('gm-c'),place:v('gm-p'),note:v('gm-n')}),1);toast('Aftale gemt')}
  if(a==='gtask'){const x=v('gt-t');if(!x)return toast('Skriv en opgave',1);
    set(()=>G().tasks.push({id:uid(),text:x,who:v('gt-w'),due:v('gt-d'),done:false}),1)}
  if(a==='gmem'){const x=v('gp-n');if(!x)return toast('Skriv et navn',1);
    set(()=>G().members.push({id:uid(),name:x,c:v('gp-c')}),1)}
  if(a==='gdrive'){const u=v('gd-u');set(()=>{S.gdrive=u},1);toast(u?'Mappe gemt':'Mappe fjernet')}
  if(a==='drive'){const u=v('dr-u');set(()=>{S.drive=u},1);toast(u?'Mappe gemt':'Mappe fjernet')}
  if(a==='impUI'){$('#impbox').style.display='block';$('#imp').focus()}
  if(a==='impX'){$('#impbox').style.display='none'}
  if(a==='imp'){try{const p=JSON.parse(v('imp'));if(!p||typeof p!=='object')throw 0;
    if(!confirm('Gendan backup? Det overskriver hvad der ligger nu.'))return;
    set(()=>{S={...S,...p}},1);toast('Gendannet')}catch(e){toast('Filen kunne ikke læses',1)}}
  if(a==='ics'){const r=v('ics');if(!r.includes('BEGIN:VEVENT'))return toast('Det ligner ikke en .ics-fil',1);
    const p=parseICS(r);if(!p.L.length)return toast('Fandt ingen lektioner',1);
    LESSONS=p.L;SOCIAL=p.S;toast(p.L.length+' lektioner indlæst');draw()}
  if(a==='wipe'){if(!confirm('Slet alt dit indhold? Hent evt. en backup først.'))return;
    set(()=>{S={lessons:{},tasks:[],reading:[],files:[],inbox:[],pins:[],rep:[],drive:S.drive,gdrive:S.gdrive,
      grp:{meets:[],tasks:[],members:[]},focus:['','',''],meta:{}}},1);toast('Nulstillet')}
});

$('#fab').addEventListener('click',capture);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();capture();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'&&tab!=='noter'){e.preventDefault();tab='noter';draw();
    setTimeout(()=>{const x=$('#q');if(x)x.focus()},40);return}
  if(e.key==='Escape'){if($('#cap'))return capX();if(q){q='';draw();return}if(openL){openL=null;draw()}return}
  if(e.key!=='Enter')return;const id=e.target.id;if(!id)return;
  const M={'cap-i':'capS','t-t':'task','t-d':'task','r-t':'read','r-d':'read','p-t':'rep',
    'f-n':'file','f-u':'file','pf-u':'pfile','pf-n':'pfile','qf-u':'qfile','dr-u':'drive',
    'pn-t':'pin','pn-u':'pin','gm-p':'gmeet','gm-n':'gmeet','gm-c':'gmeet','gt-t':'gtask','gt-w':'gtask','gt-d':'gtask',
    'gp-n':'gmem','gp-c':'gmem','gd-u':'gdrive','gh-t':'ghOn','gh-r':'ghOn','gh-o':'ghOn'};
  if(M[id]){e.preventDefault();const b=document.querySelector(`[data-a="${M[id]}"]`);if(b)b.click()}
});

let it,qt;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){q=el.value;clearTimeout(qt);qt=setTimeout(()=>{const p=el.selectionStart;draw();
    const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}},220);return}
  if(el.dataset.focus!==undefined)S.focus[+el.dataset.focus]=el.value;
  else if(el.dataset.l&&el.dataset.f){const i=el.dataset.l;S.lessons[i]=S.lessons[i]||{};S.lessons[i][el.dataset.f]=el.value}
  else return;
  DIRTY=1;clearTimeout(it);it=setTimeout(()=>{save(1);nav()},800);
});
window.addEventListener('beforeunload',()=>{if(DIRTY)save(1)});
(async()=>{await load();draw()})();

</script>
</body>
</html>
